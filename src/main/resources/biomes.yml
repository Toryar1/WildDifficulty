# ============================================================
#  WildDifficulty — biomes.yml
#  Per-biome difficulty rules
# ============================================================
#
#  General Biome Format:
#
#  BIOME_NAME:                         # Key = Bukkit Biome enum name (e.g. DESERT, JUNGLE...)
#    mobs-autorises:                    # (optional) Only these mobs can spawn in this biome
#      - ZOMBIE
#    mobs-interdits:                    # (optional) These mobs CANNOT spawn in this biome
#      - SPIDER
#    modificateurs:                     # (optional) Multipliers applied to mobs spawning here
#      multiplicateur-pv: 1.0
#      multiplicateur-degats: 1.0
#      multiplicateur-vitesse: 1.0
#      multiplicateur-portee-detection: 1.0
#      multiplicateur-resistance-knockback: 1.0
#      resistance-feu: false            # true = fire immunity (permanent potion effect)
#      tier-equipement: "none"          # none | leather | iron | diamond | netherite
#      chance-equipement: 0.0           # 0.0 to 1.0
#    mobs:                              # (optional) Mob-specific overrides in this biome
#      ZOMBIE:
#        multiplicateur-pv: 1.5
#        multiplicateur-degats: 1.2
# ============================================================

# ─── Biome: Desert ──────────────────────────────────────────
DESERT:
  # Only these mobs can spawn in desert
  mobs-autorises:
    - ZOMBIE
    - HUSK
    - SKELETON
  # These mobs CANNOT spawn in desert
  mobs-interdits:
    - SPIDER
  modificateurs:
    multiplicateur-pv: 1.25
    multiplicateur-degats: 1.15
    multiplicateur-vitesse: 1.05
    # Desert mobs are fire resistant
    resistance-feu: true
    tier-equipement: "iron"
    chance-equipement: 0.3

# ─── Biome: Dark Forest ─────────────────────────────────────
DARK_FOREST:
  mobs-autorises:
    - ZOMBIE
    - SKELETON
    - CREEPER
    - SPIDER
    - WITCH
  modificateurs:
    multiplicateur-pv: 1.20
    multiplicateur-degats: 1.20
    multiplicateur-portee-detection: 1.5
    tier-equipement: "leather"
    chance-equipement: 0.4
