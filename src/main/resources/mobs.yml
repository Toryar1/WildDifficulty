# ============================================================
#  WildDifficulty — mobs.yml
#  Individual configuration per vanilla mob type
# ============================================================
#
#  General Format:
#
#  MOB_TYPE:                           # Key = Bukkit EntityType enum name (e.g. ZOMBIE, SKELETON...)
#    peut-spawner-de-jour: false       # true = can spawn during daylight
#    ignore-soleil: false              # true = does not burn in sunlight
#    modificateurs:                    # (optional) Specific overrides for this mob type
#      multiplicateur-pv: 1.0         #   Applied IN ADDITION to biome/distance/zone modifiers
#      multiplicateur-degats: 1.0
#      multiplicateur-vitesse: 1.0
#      multiplicateur-portee-detection: 1.0
#      multiplicateur-resistance-knockback: 1.0
#      resistance-feu: false
#      tier-equipement: "none"        # none | leather | iron | diamond | netherite
#      chance-equipement: 0.0
#
#  Multiplier Priority Order:
#  Global × Biome × Distance × Zone × Mob-Override = Final
# ============================================================

# ─── Zombie ─────────────────────────────────────────────────
ZOMBIE:
  # Zombies spawn during daylight and do not burn
  peut-spawner-de-jour: true
  ignore-soleil: true

# ─── Skeleton ───────────────────────────────────────────────
SKELETON:
  peut-spawner-de-jour: true
  ignore-soleil: true

# ─── Husk ───────────────────────────────────────────────────
HUSK:
  peut-spawner-de-jour: true
  ignore-soleil: true
  # Husks have a bonus HP multiplier
  modificateurs:
    multiplicateur-pv: 1.10

# ─── Stray ──────────────────────────────────────────────────
STRAY:
  peut-spawner-de-jour: false
  ignore-soleil: false
  modificateurs:
    multiplicateur-vitesse: 0.90  # Slower, but shoots slowness arrows

# ─── Zombified Piglin ───────────────────────────────────────
ZOMBIFIED_PIGLIN:
  peut-spawner-de-jour: true
  ignore-soleil: true
  modificateurs:
    multiplicateur-pv: 1.15
    multiplicateur-degats: 1.10

# ─── Witch ──────────────────────────────────────────────────
WITCH:
  peut-spawner-de-jour: true
  ignore-soleil: true
  modificateurs:
    multiplicateur-pv: 1.20
    multiplicateur-portee-detection: 1.5

# ─── Spider ─────────────────────────────────────────────────
SPIDER:
  peut-spawner-de-jour: true
  modificateurs:
    multiplicateur-vitesse: 1.15

# ─── Cave Spider ────────────────────────────────────────────
CAVE_SPIDER:
  modificateurs:
    multiplicateur-vitesse: 1.20
    multiplicateur-degats: 1.10

# ─── Creeper ────────────────────────────────────────────────
CREEPER:
  peut-spawner-de-jour: false
  modificateurs:
    multiplicateur-pv: 1.10
    multiplicateur-vitesse: 1.05

# ─── Enderman ───────────────────────────────────────────────
ENDERMAN:
  peut-spawner-de-jour: true
  modificateurs:
    multiplicateur-pv: 1.25
    multiplicateur-degats: 1.20
    multiplicateur-portee-detection: 2.0

# ─── Phantom ────────────────────────────────────────────────
PHANTOM:
  peut-spawner-de-jour: false
  modificateurs:
    multiplicateur-vitesse: 1.20
    multiplicateur-degats: 1.15
