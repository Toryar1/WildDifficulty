# ============================================================
#  WildDifficulty — mobs.yml
#  Configuration individuelle par type de mob vanilla
# ============================================================
#
#  Format général :
#
#  TYPE_MOB:                           # Clé = nom enum Bukkit EntityType (ex: ZOMBIE, SKELETON...)
#    peut-spawner-de-jour: false       # true = peut spawner même en plein jour
#    ignore-soleil: false              # true = ne brûle pas au soleil
#    modificateurs:                    # (optionnel) Surcharges propres à ce type de mob
#      multiplicateur-pv: 1.0         #   Appliqué EN PLUS des modificateurs biome/distance/zone
#      multiplicateur-degats: 1.0
#      multiplicateur-vitesse: 1.0
#      multiplicateur-portee-detection: 1.0
#      multiplicateur-resistance-knockback: 1.0
#      resistance-feu: false
#      tier-equipement: "none"        # none | leather | iron | diamond | netherite
#      chance-equipement: 0.0
#
#  Ordre de priorité des multiplicateurs :
#  Globaux × Biome × Distance × Zone × Mob-Override = Final
# ============================================================

# ─── Zombie ─────────────────────────────────────────────────
ZOMBIE:
  # Les zombies spawnent de jour et ne brûlent pas (rendu cohérent avec le lore "Wild")
  peut-spawner-de-jour: true
  ignore-soleil: true

# ─── Squelette ──────────────────────────────────────────────
SKELETON:
  peut-spawner-de-jour: true
  ignore-soleil: true

# ─── Husk (zombie du désert) ────────────────────────────────
HUSK:
  peut-spawner-de-jour: true
  ignore-soleil: true
  # Les husks ont naturellement un bonus de PV supplémentaire
  modificateurs:
    multiplicateur-pv: 1.10

# ─── Stray (squelette des neiges) ───────────────────────────
STRAY:
  peut-spawner-de-jour: false
  ignore-soleil: false
  modificateurs:
    multiplicateur-vitesse: 0.90  # Plus lent, mais tire des flèches de lenteur

# ─── Zombie piglin ──────────────────────────────────────────
ZOMBIFIED_PIGLIN:
  peut-spawner-de-jour: true
  ignore-soleil: true
  modificateurs:
    multiplicateur-pv: 1.15
    multiplicateur-degats: 1.10

# ─── Sorcière ───────────────────────────────────────────────
WITCH:
  peut-spawner-de-jour: false
  ignore-soleil: false
  modificateurs:
    multiplicateur-pv: 1.20
    multiplicateur-portee-detection: 1.15

# ─── Creeper ────────────────────────────────────────────────
CREEPER:
  peut-spawner-de-jour: false
  ignore-soleil: false

# ─── Araignée ───────────────────────────────────────────────
SPIDER:
  # Les araignées hostiles la nuit, neutres le jour — on ne change pas ce comportement par défaut
  peut-spawner-de-jour: false
  ignore-soleil: false
  modificateurs:
    multiplicateur-vitesse: 1.05

# ─── Araignée des cavernes ──────────────────────────────────
CAVE_SPIDER:
  peut-spawner-de-jour: false
  ignore-soleil: false
  modificateurs:
    multiplicateur-pv: 1.10
    multiplicateur-vitesse: 1.10

# ─── Blaze ──────────────────────────────────────────────────
BLAZE:
  peut-spawner-de-jour: true
  ignore-soleil: true
  modificateurs:
    multiplicateur-pv: 1.20
    multiplicateur-degats: 1.15
    resistance-feu: true

# ─── Ghast ──────────────────────────────────────────────────
GHAST:
  peut-spawner-de-jour: true
  ignore-soleil: true
  modificateurs:
    multiplicateur-pv: 1.10
    resistance-feu: true

# ─── Squelette Wither ───────────────────────────────────────
WITHER_SKELETON:
  peut-spawner-de-jour: true
  ignore-soleil: true
  modificateurs:
    multiplicateur-pv: 1.25
    multiplicateur-degats: 1.20
    resistance-feu: true
    tier-equipement: "iron"
    chance-equipement: 0.4

# ─── Pillard ────────────────────────────────────────────────
PILLAGER:
  peut-spawner-de-jour: false
  ignore-soleil: false
  modificateurs:
    multiplicateur-pv: 1.10
    multiplicateur-portee-detection: 1.20

# ─── Vindicateur ────────────────────────────────────────────
VINDICATOR:
  peut-spawner-de-jour: false
  ignore-soleil: false
  modificateurs:
    multiplicateur-pv: 1.15
    multiplicateur-degats: 1.25

# ─── Évocateur ──────────────────────────────────────────────
EVOKER:
  peut-spawner-de-jour: false
  ignore-soleil: false
  modificateurs:
    multiplicateur-pv: 1.30
    multiplicateur-portee-detection: 1.20

# ─── Noyé (Drowned) ─────────────────────────────────────────
DROWNED:
  peut-spawner-de-jour: true
  ignore-soleil: true  # Les noyés ne brûlent pas sous l'eau de toute façon
  modificateurs:
    multiplicateur-pv: 1.10

# ─── Phantom ────────────────────────────────────────────────
PHANTOM:
  peut-spawner-de-jour: false
  ignore-soleil: false
  modificateurs:
    multiplicateur-vitesse: 1.10
    multiplicateur-degats: 1.05
