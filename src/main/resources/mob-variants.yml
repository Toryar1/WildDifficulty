# ============================================================
#  WildDifficulty — mob-variants.yml
#  Configuration des variantes de monstres et des escouades
# ============================================================

variantes:
  # === ZOMBIES (5 VARIANTES) ===
  zombie_normal:
    type: ZOMBIE
    nom-affiche: "&2Zombie Standard"
    poids: 60
    comportement-aggro: AGGRESSIVE

  zombie_tank:
    type: ZOMBIE
    nom-affiche: "&8Zombie Blindé"
    poids: 15
    ignore-soleil: true
    taille: 1.2
    modificateurs:
      multiplicateur-pv: 3.0
      multiplicateur-vitesse: 0.8
      tier-equipement: "iron"
      chance-equipement: 1.0
    comportement-aggro: AGGRESSIVE

  zombie_rapide:
    type: ZOMBIE
    nom-affiche: "&cZombie Enragé"
    poids: 15
    taille: 0.9
    modificateurs:
      multiplicateur-vitesse: 1.4
      multiplicateur-degats: 1.2
      multiplicateur-pv: 0.8
    comportement-aggro: AGGRESSIVE

  zombie_geant:
    type: ZOMBIE
    nom-affiche: "&6Colosse Mort-Vivant"
    poids: 5
    ignore-soleil: true
    taille: 2.8
    modificateurs:
      multiplicateur-pv: 5.0
      multiplicateur-degats: 2.0
      multiplicateur-vitesse: 0.75
      resistance-recul: 1.0
      regen-passive: 1.0
      vision-murs: true
    comportement-aggro: AGGRESSIVE

  zombie_infecte:
    type: ZOMBIE
    nom-affiche: "&5Bébé Zombie Infecté"
    poids: 5
    bebe: true
    comportement-aggro: AGGRESSIVE
    modificateurs:
      multiplicateur-vitesse: 1.3
      multiplicateur-pv: 0.9
      effets-potion:
        - WITHER
        - HUNGER

  # === SQUELETTES (5 VARIANTES) ===
  skeleton_normal:
    type: SKELETON
    nom-affiche: "&7Squelette"
    poids: 60
    comportement-aggro: AGGRESSIVE

  skeleton_elite:
    type: SKELETON
    nom-affiche: "&6Squelette de Garde"
    poids: 15
    ignore-soleil: true
    modificateurs:
      multiplicateur-pv: 1.8
      tier-equipement: "chainmail"
      chance-equipement: 1.0
      resistance-feu: 0.0
    comportement-aggro: AGGRESSIVE

  skeleton_sniper:
    type: SKELETON
    nom-affiche: "&9Sniper Squelette"
    poids: 12
    taille: 1.15
    modificateurs:
      multiplicateur-degats: 1.5
      multiplicateur-vitesse: 1.1
      multiplicateur-portee: 2.0
      attaque-distance: true
    comportement-aggro: AGGRESSIVE

  skeleton_glace:
    type: SKELETON
    nom-affiche: "&bSquelette de Glace"
    poids: 10
    modificateurs:
      multiplicateur-pv: 1.2
      effets-potion:
        - SLOWNESS
    comportement-aggro: AGGRESSIVE

  skeleton_boss:
    type: SKELETON
    nom-affiche: "&4Seigneur Squelette"
    poids: 3
    ignore-soleil: true
    taille: 1.5
    comportement-aggro: AGGRESSIVE
    modificateurs:
      multiplicateur-pv: 6.0
      multiplicateur-degats: 2.2
      resistance-recul: 0.8
      teleport-cible: true
      charge-dash: true
      bossbar-active: true
      bossbar-couleur: RED
      bossbar-style: NOTCHED_20

  # === PIGLINS (5 VARIANTES) ===
  piglin_normal:
    type: PIGLIN
    nom-affiche: "&6Piglin Standard"
    poids: 50
    comportement-aggro: NEUTRAL_HIT

  piglin_guerrier:
    type: PIGLIN
    nom-affiche: "&cSoldat Piglin"
    poids: 25
    comportement-aggro: AGGRESSIVE
    modificateurs:
      multiplicateur-pv: 1.5
      multiplicateur-degats: 1.3
      tier-equipement: "golden"
      chance-equipement: 0.8

  piglin_chef:
    type: PIGLIN
    nom-affiche: "&eCenturion Piglin"
    poids: 10
    comportement-aggro: NEUTRAL_SQUAD_HIT
    modificateurs:
      multiplicateur-pv: 2.5
      regen-passive: 1.5
      tier-equipement: "golden"
      chance-equipement: 1.0

  piglin_brute_mutant:
    type: PIGLIN
    nom-affiche: "&4Piglin Brute Mutante"
    poids: 10
    taille: 1.4
    comportement-aggro: AGGRESSIVE
    modificateurs:
      multiplicateur-pv: 4.0
      multiplicateur-degats: 1.8
      resistance-recul: 0.7

  piglin_bebe_ninja:
    type: PIGLIN
    nom-affiche: "&dNinja Piglin Espion"
    poids: 5
    bebe: true
    comportement-aggro: AGGRESSIVE
    modificateurs:
      camouflage: true
      multiplicateur-vitesse: 1.5
      multiplicateur-pv: 0.7

  # === ANIMAUX AGRESSIFS (3 VARIANTES) ===
  vache_enragee:
    type: COW
    nom-affiche: "&cMégaboeuf Enragé"
    poids: 100
    taille: 2.0
    comportement-aggro: AGGRESSIVE
    modificateurs:
      multiplicateur-pv: 4.0
      multiplicateur-degats: 4.0
      multiplicateur-vitesse: 0.75
      resistance-recul: 0.9

  mouton_tueur:
    type: SHEEP
    nom-affiche: "&fMouton Tueur de Montagne"
    poids: 100
    taille: 0.8
    comportement-aggro: AGGRESSIVE
    modificateurs:
      multiplicateur-pv: 1.5
      multiplicateur-degats: 3.0
      multiplicateur-vitesse: 1.35
      mouton-tondu: true

  poulet_explosif:
    type: CHICKEN
    nom-affiche: "&eVolaille Instable"
    poids: 100
    taille: 1.3
    comportement-aggro: AGGRESSIVE
    modificateurs:
      multiplicateur-vitesse: 1.5
      explosion-mort: true


escouades:
  horde_morts_vivants:
    types-declencheurs:
      - ZOMBIE
      - SKELETON
    chance-declenchement: 0.08
    biomes-autorises: []
    zones-autorisees: []
    membres:
      zombie_tank:
        min: 1
        max: 1
      zombie_rapide:
        min: 1
        max: 3
      zombie_normal:
        min: 2
        max: 5
      skeleton_elite:
        min: 0
        max: 1
      skeleton_normal:
        min: 1
        max: 3

  escouade_piglins:
    types-declencheurs:
      - PIGLIN
    chance-declenchement: 0.10
    membres:
      piglin_chef:
        min: 1
        max: 1
      piglin_guerrier:
        min: 2
        max: 4
      piglin_normal:
        min: 2
        max: 6
      piglin_bebe_ninja:
        min: 0
        max: 1

  meute_animaux:
    types-declencheurs:
      - COW
      - SHEEP
    chance-declenchement: 0.05
    membres:
      vache_enragee:
        min: 1
        max: 2
      mouton_tueur:
        min: 2
        max: 4
      poulet_explosif:
        min: 0
        max: 3
