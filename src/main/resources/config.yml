# ============================================================
#  WildDifficulty — config.yml
#  Main plugin configuration file
#  Target: Purpur 1.21.4 / Paper-API 1.21.4-R0.1-SNAPSHOT
# ============================================================

# ─────────────────────────────────────────
#  General Plugin Settings
# ─────────────────────────────────────────
plugin:
  # Enable language code (fr, en, de, es, pt_BR, nl, pl, ru, zh_CN, it)
  language: "en"

  # Enable debug mode (extra logs in console — disable in production)
  debug: false

  # Maximum spawn distance (in blocks) from player beyond which natural mobs do not spawn (-1 to disable)
  distance-spawn-max-joueur: 96

# ─────────────────────────────────────────
#  Base Global Modifiers
#  These multipliers apply to ALL mobs regardless of biome, distance or zone. 1.0 = neutral.
# ─────────────────────────────────────────
modificateurs-globaux:
  multiplicateur-pv: 1.0
  multiplicateur-degats: 1.0
  multiplicateur-vitesse: 1.0
  multiplicateur-portee-detection: 1.0
  multiplicateur-resistance-knockback: 1.0

# ─────────────────────────────────────────
#  Distance Scaling
#  Difficulty increases as players get further from the central origin point.
# ─────────────────────────────────────────
scaling-distance:
  actif: true
  monde: "world"
  x: 0
  y: 64
  z: 0
  pas-blocs: 250
  pourcent-par-pas: 0.08

# ─────────────────────────────────────────
#  Cap of variants per player
# ─────────────────────────────────────────
cap-variantes-joueur: 15
